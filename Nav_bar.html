<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nav_bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
</head>

<style>
  /* ─── CSS VARIABLES ─── */
  :root {
    --bg: #f5f0e8;
    --text: #0a0a0a;
    --border: #e0d9ce;
    --muted: #888;
  }

  /* ─── RESET ─── */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding-top: 64px; /* Offset for fixed nav */
  }

  /* ─── NAV ─── */
  nav {
    position: fixed;        /* Follows the page on scroll */
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    height: 64px;
    display: flex;
    align-items: center;
    transition: box-shadow 0.3s ease, padding 0.3s ease;
  }

  /* Slight shadow when scrolled */
  nav.scrolled {
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
  }

  .nav-inner {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ─── HAMBURGER ─── */
  .nav-hamburger {
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 38px;
    height: 38px;
    background: none;
    border: none;
    padding: 8px 6px;
    flex-shrink: 0;
    position: relative;
  }
  .nav-hamburger span {
    display: block;
    width: 22px;
    height: 1.5px;
    background: var(--text);
    transform-origin: center;
    transition: transform 0.3s cubic-bezier(0.76, 0, 0.24, 1),
                opacity  0.2s ease;
  }
  /* Animate to × when drawer is open */
  .nav-hamburger.is-open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .nav-hamburger.is-open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  .nav-hamburger.is-open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

  /* ─── NAV DIVIDER ─── */
  .nav-divider {
    width: 1px;
    height: 40px;
    background: var(--border);
    margin: 0 20px;
    flex-shrink: 0;
  }

  /* ─── LOGO ─── */
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    font-family: "Inter", sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: -1.5px;
    color: #000;
    line-height: 1;
  }
  .nav-logo img {
    margin-top: 6px;
    height: 130px;
    width: auto;
    display: block;
  }

  /* ─── NAV RIGHT ─── */
  .nav-right { margin-left: auto; }

  .nav-cta {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--text);
    padding: 8px 18px;
    border-radius: 100px;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .nav-cta:hover { background: var(--text); color: var(--bg); }

  /* ─── DRAWER OVERLAY ─── */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, 0.4);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .drawer-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  /* ─── DRAWER PANEL ─── */
  .nav-drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(400px, 100vw);
    background: var(--bg);
    border-right: 1px solid var(--border);
    z-index: 201;
    display: flex;
    flex-direction: column;
    padding: 0 40px 40px;
    transform: translateX(-100%);
    transition: transform 0.4s cubic-bezier(0.76, 0, 0.24, 1);
    overflow-y: auto;
  }
  .nav-drawer.open { transform: translateX(0); }

  /* Staggered item entrance */
  .nav-drawer.open .drawer-item {
    animation: itemSlideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .nav-drawer.open .drawer-item:nth-child(1) { animation-delay: 0.12s; }
  .nav-drawer.open .drawer-item:nth-child(2) { animation-delay: 0.18s; }
  .nav-drawer.open .drawer-item:nth-child(3) { animation-delay: 0.24s; }
  .nav-drawer.open .drawer-item:nth-child(4) { animation-delay: 0.30s; }
  .nav-drawer.open .drawer-item:nth-child(5) { animation-delay: 0.36s; }
  .nav-drawer.open .drawer-social { animation: itemSlideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) 0.42s both; }

  @keyframes itemSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── DRAWER TOPBAR ─── */
  .drawer-topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    height: 64px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    margin: 0 -40px;
    padding: 0 40px;
    margin-bottom: 8px;
  }

  /* ─── CLOSE BUTTON ─── */
  .drawer-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: none;
    border: 1px solid var(--border);
    cursor: pointer;
    border-radius: 50%;
    transition: background 0.18s, border-color 0.18s;
    flex-shrink: 0;
  }
  .drawer-close:hover {
    background: var(--text);
    border-color: var(--text);
  }
  .drawer-close:hover svg { stroke: var(--bg); }
  .drawer-close svg {
    width: 14px;
    height: 14px;
    stroke: var(--text);
    transition: stroke 0.18s;
  }

  /* ─── DRAWER NAV ITEMS ─── */
  .drawer-items { flex: 1; padding-top: 12px; }

  .drawer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    font-family: "Boldonse", system-ui;
    font-size: 12px;
    font-weight: 200;
    font-style: normal;
    letter-spacing: -0.5px;
    transition: color 0.2s;
  }


  .drawer-item:hover { color: var(--muted); }
  .drawer-item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.2s;
  }
  .drawer-item:hover svg {
    opacity: 0.4;
    transform: translate(2px, -2px);
  }

  /* ─── DRAWER SOCIAL ─── */
  .drawer-social {
    display: flex;
    gap: 20px;
    padding-top: 36px;
    flex-wrap: wrap;
    opacity: 0;
  }
  .nav-drawer.open .drawer-social { opacity: 1; }
  .drawer-social a {
    color: var(--text);
    opacity: 0.4;
    transition: opacity 0.2s;
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .drawer-social a:hover { opacity: 1; }

  /* ─── DEMO CONTENT (remove in your real pages) ─── */
  .demo-content {
    max-width: 700px;
    margin: 60px auto;
    padding: 0 24px;
    font-family: 'DM Serif Display', serif;
  }
  .demo-content h1 {
    font-size: 48px;
    letter-spacing: -1.5px;
    margin-bottom: 20px;
  }
  .demo-content p {
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    line-height: 1.7;
    color: #444;
    margin-bottom: 16px;
  }
</style>

<body>

  <!-- OVERLAY -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- DRAWER PANEL -->
  <div class="nav-drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Navigation menu">

    <div class="drawer-topbar">
      <button class="drawer-close" id="drawerCloseBtn" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="drawer-items">
      <a href="https://unstablethoughts.blog" class="drawer-item">
        Home
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a href="Archive" class="drawer-item">
        Archive
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a href="About" class="drawer-item">
        About
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a href="#Q&A" class="drawer-item">
        Q&amp;A
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a href="#newsletter" class="drawer-item">
        Newsletter
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    <div class="drawer-social">
      <a href="https://x.com/unstable_india">X</a>
      <a href="https://www.instagram.com/unstablethoughtsindia?igsh=dGc4YnF3Z2l5djQ3">Instagram</a>
      <a href="mailto:unstablethoughtsindia@gmail.com">Email</a>
    </div>
  </div>

  <!-- NAV -->
  <nav id="mainNav">
    <div class="nav-inner">
      <button class="nav-hamburger" id="hamburger"
              aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-divider"></div>

      <!-- Fixed: <a> instead of <p> for logo -->
      <a href="/" class="nav-logo">
        <img src="https://lh3.googleusercontent.com/d/1P5kTpPx_NHzhWGWkPkbJvDz2wMPsOP6E" alt="Unstable Thoughts logo">
      </a>

    </div>
  </nav>


</body>
</html>
