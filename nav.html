<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- OVERLAY -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- DRAWER -->
<div class="nav-drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Navigation menu">
  <div class="drawer-topbar">
    <button class="drawer-close" id="drawerCloseBtn" onclick="closeDrawer()" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
  <div class="drawer-items">
    <a href="https://unstablethoughts.blog" class="drawer-item">Home<svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="Archive" class="drawer-item" onclick="closeDrawer()">Archive<svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="About" class="drawer-item" onclick="closeDrawer()">About<svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="https://unstablethoughts.blog/#Q&A" class="drawer-item" onclick="closeDrawer()">Q&A<svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="https://unstablethoughts.blog/#newsletter" class="drawer-item" onclick="closeDrawer()">Newsletter<svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>
  <div class="drawer-social">
    <a href="https://x.com/unstable_india">X</a><a href="https://www.instagram.com/unstablethoughtsindia">Instagram</a><a href="mailto:unstablethoughtsindia@gmail.com">Email</a><a href="#">RSS</a>
  </div>
</div>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <button class="nav-hamburger" id="hamburger" onclick="openDrawer()" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-divider"></div>
    <div class="nav-logo"><img src="https://lh3.googleusercontent.com/d/1P5kTpPx_NHzhWGWkPkbJvDz2wMPsOP6E" alt="logo"></div>
    <div class="nav-right">
      
    </div>
  </div>
</nav>
</body>
<script>
    const menuBtn = document.getElementById("menu-btn");
    const navMenu = document.getElementById("nav-menu");

    menuBtn.addEventListener("click", () => {
        navMenu.classList.toggle("active");
    });
</script>
</html>
